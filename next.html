<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitality Points Explorer • Discovery Vitality</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone/babel.min.js"></script>
    <!-- Tailwind with darkMode: class explicitly configured -->
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwindConfig = { darkMode: 'class' };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; }

        .header-bg { background: linear-gradient(90deg, #00a3e0, #0077b6); }

        .section-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .section-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px -8px rgba(0,0,0,0.12);
        }

        table { border-collapse: collapse; width: 100%; }

        .badge-cap {
            display: inline-block;
            background: #fef9c3;
            color: #854d0e;
            font-size: 0.6rem;
            padding: 1px 5px;
            border-radius: 999px;
            font-weight: 700;
            vertical-align: middle;
            margin-left: 5px;
            letter-spacing: 0.03em;
        }

        /* ── LIGHT THEME VARS ── */
        :root {
            --bg-page:      #f3f4f6;
            --bg-card:      #ffffff;
            --bg-subtle:    #f9fafb;
            --bg-row-alt:   #f3f4f6;
            --bg-thead:     #f3f4f6;
            --bg-info:      #eff6ff;
            --bg-success:   #f0fdf4;
            --bg-warn:      #fffbeb;
            --bg-orange:    #fff7ed;
            --bg-purple:    #faf5ff;
            --bg-red:       #fef2f2;
            --text-primary: #111827;
            --text-secondary:#6b7280;
            --text-muted:   #9ca3af;
            --text-info:    #1d4ed8;
            --text-success: #15803d;
            --text-warn:    #92400e;
            --text-orange:  #c2410c;
            --text-purple:  #7e22ce;
            --border:       #e5e7eb;
            --border-subtle:#f3f4f6;
            --accent:       #00a3e0;
        }

        /* ── DARK THEME VARS ── */
        html.dark {
            --bg-page:      #0f172a;
            --bg-card:      #1e293b;
            --bg-subtle:    #1e293b;
            --bg-row-alt:   #263346;
            --bg-thead:     #263346;
            --bg-info:      #1e3a5f;
            --bg-success:   #052e16;
            --bg-warn:      #422006;
            --bg-orange:    #431407;
            --bg-purple:    #2e1065;
            --bg-red:       #450a0a;
            --text-primary: #f1f5f9;
            --text-secondary:#94a3b8;
            --text-muted:   #64748b;
            --text-info:    #93c5fd;
            --text-success: #86efac;
            --text-warn:    #fde68a;
            --text-orange:  #fdba74;
            --text-purple:  #d8b4fe;
            --border:       #334155;
            --border-subtle:#1e293b;
            --accent:       #38bdf8;
        }

        html.dark .badge-cap { background: #713f12; color: #fef9c3; }

        /* Apply vars to the page */
        body { background: var(--bg-page); color: var(--text-primary); }

        .v-card    { background: var(--bg-card); }
        .v-subtle  { background: var(--bg-subtle); }
        .v-thead   { background: var(--bg-thead); }
        .v-row-alt { background: var(--bg-row-alt); }
        .v-info    { background: var(--bg-info);    color: var(--text-info); }
        .v-success { background: var(--bg-success); color: var(--text-success); }
        .v-warn    { background: var(--bg-warn);    color: var(--text-warn); }
        .v-orange  { background: var(--bg-orange);  color: var(--text-orange); }
        .v-purple  { background: var(--bg-purple);  color: var(--text-purple); }
        .v-red     { background: var(--bg-red);     color: var(--text-red, #b91c1c); }
        .v-border  { border-color: var(--border); }
        .v-divide > * + * { border-top: 1px solid var(--border); }
        .v-text-secondary { color: var(--text-secondary); }
        .v-text-muted     { color: var(--text-muted); }
        .v-accent         { color: var(--accent); }

        .nav-pill {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
            transition: border-color 0.15s, color 0.15s;
        }
        .nav-pill:hover { border-color: var(--accent); color: var(--accent); }

        .themed-input {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .themed-input:focus { outline: none; box-shadow: 0 0 0 3px rgba(0,163,224,0.25); border-color: var(--accent); }

        .tbl-row { border-bottom: 1px solid var(--border); }
        .tbl-row:last-child { border-bottom: none; }
        .tbl-row:hover { background: var(--bg-row-alt); }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
    const [dob, setDob]     = useState('');
    const [age, setAge]     = useState(null);
    const [maxHR, setMaxHR] = useState(null);
    const [zones, setZones] = useState({
        z60_69: '60–69%', z70_79: '70–79%',
        z80p: '80%+', z60p: '60%+', z70p: '70%+'
    });
    const [theme, setTheme] = useState('system');

    useEffect(() => {
        const d = localStorage.getItem('vitalityDOB');
        if (d) { setDob(d); calcHR(d); }
        const t = localStorage.getItem('vitalityTheme') || 'system';
        setTheme(t); applyTheme(t);

        // Watch system preference changes
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        const handler = () => {
            if (localStorage.getItem('vitalityTheme') === 'system') applyTheme('system');
        };
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
    }, []);

    function calcHR(d) {
        if (!d) {
            setAge(null); setMaxHR(null);
            setZones({ z60_69:'60–69%', z70_79:'70–79%', z80p:'80%+', z60p:'60%+', z70p:'70%+' });
            return;
        }
        const dob  = new Date(d), today = new Date();
        let a = today.getFullYear() - dob.getFullYear();
        if (today.getMonth() < dob.getMonth() ||
           (today.getMonth() === dob.getMonth() && today.getDate() < dob.getDate())) a--;
        const mhr = 220 - a;
        setAge(a); setMaxHR(mhr);
        setZones({
            z60_69: `${Math.round(mhr*.60)}–${Math.round(mhr*.69)} BPM`,
            z70_79: `${Math.round(mhr*.70)}–${Math.round(mhr*.79)} BPM`,
            z80p:   `≥${Math.round(mhr*.80)} BPM`,
            z60p:   `≥${Math.round(mhr*.60)} BPM`,
            z70p:   `≥${Math.round(mhr*.70)} BPM`,
        });
        localStorage.setItem('vitalityDOB', d);
    }

    function applyTheme(t) {
        const html = document.documentElement;
        const dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        html.classList.toggle('dark', dark);
        localStorage.setItem('vitalityTheme', t);
    }

    function setT(t) { setTheme(t); applyTheme(t); }

    const z = zones;

    /* ── Small helpers ── */
    const Pts = ({v}) => <span style={{color:'var(--accent)', fontWeight:600}}>{v}</span>;

    function InfoBox({color, children}) {
        return <div className={`v-${color} rounded-2xl p-4 text-sm`} style={{borderRadius:'16px', padding:'16px'}}>{children}</div>;
    }

    function SectionCard({id, icon, title, subtitle, children}) {
        return (
            <div id={id} className="section-card v-card rounded-3xl mb-8 md:mb-12"
                 style={{borderRadius:'24px', padding:'24px 28px', overflow:'hidden'}}>
                <div style={{display:'flex', alignItems:'center', gap:'14px', marginBottom:'22px'}}>
                    <div style={{width:44,height:44,background:'#00a3e0',borderRadius:14,display:'flex',
                                 alignItems:'center',justifyContent:'center',fontSize:'1.4rem',flexShrink:0}}>
                        {icon}
                    </div>
                    <div>
                        <h2 style={{margin:0,fontSize:'1.35rem',fontWeight:600}}>{title}</h2>
                        {subtitle && <p style={{margin:'2px 0 0',fontSize:'0.85rem',color:'var(--text-secondary)'}}>{subtitle}</p>}
                    </div>
                </div>
                {children}
            </div>
        );
    }

    function Tbl({children}) {
        return (
            <div style={{overflowX:'auto',borderRadius:16,border:'1px solid var(--border)',marginBottom:4}}>
                <table style={{width:'100%',fontSize:'0.875rem'}}>
                    {children}
                </table>
            </div>
        );
    }

    function THead({cols}) {
        return (
            <thead>
                <tr className="v-thead">
                    {cols.map((c,i) => (
                        <th key={i} style={{textAlign: i===0?'left':'right', padding:'12px 20px',
                                            fontWeight:600, fontSize:'0.8rem', letterSpacing:'0.03em',
                                            color:'var(--text-secondary)', whiteSpace:'nowrap'}}>
                            {c}
                        </th>
                    ))}
                </tr>
            </thead>
        );
    }

    function TR({label, pts, cap, note}) {
        return (
            <tr className="tbl-row">
                <td style={{padding:'12px 20px'}}>
                    {label}
                    {cap && <span className="badge-cap">CAPPED</span>}
                    {note && <span style={{display:'block',fontSize:'0.72rem',color:'var(--text-muted)',marginTop:2}}>{note}</span>}
                </td>
                <td style={{padding:'12px 20px', textAlign:'right', fontWeight:600, color:'var(--accent)', whiteSpace:'nowrap'}}>
                    {pts}
                </td>
            </tr>
        );
    }

    function ListRow({label, pts, note}) {
        return (
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',
                         padding:'12px 16px', borderRadius:12, background:'var(--bg-subtle)',
                         marginBottom:8, gap:12, fontSize:'0.875rem'}}>
                <span>
                    {label}
                    {note && <span style={{display:'block',fontSize:'0.72rem',color:'var(--text-muted)',marginTop:2}}>{note}</span>}
                </span>
                <span style={{fontWeight:600, color:'var(--accent)', whiteSpace:'nowrap', flexShrink:0}}>{pts}</span>
            </div>
        );
    }

    function BetweenRow({label, pts}) {
        return (
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',
                         padding:'10px 0', borderBottom:'1px solid var(--border)', fontSize:'0.875rem', gap:8}}>
                <span>{label}</span>
                <span style={{fontWeight:600, color:'var(--accent)', whiteSpace:'nowrap', flexShrink:0}}>{pts}</span>
            </div>
        );
    }

    return (
        <div style={{minHeight:'100vh', background:'var(--bg-page)', color:'var(--text-primary)'}}>

            {/* ── HEADER ── */}
            <div className="header-bg" style={{paddingBottom:40}}>
                <div style={{maxWidth:1100, margin:'0 auto', padding:'24px 20px 0'}}>
                    <div style={{display:'flex', flexWrap:'wrap', justifyContent:'space-between',
                                 alignItems:'center', gap:16}}>
                        {/* Title */}
                        <div style={{display:'flex', alignItems:'center', gap:16}}>
                            <i className="fa-solid fa-heart-pulse" style={{fontSize:'2.8rem', color:'white'}}></i>
                            <div>
                                <h1 style={{margin:0, fontSize:'clamp(1.5rem,3vw,2.2rem)', fontWeight:700,
                                            color:'white', letterSpacing:'-0.02em'}}>
                                    Vitality Points Explorer
                                </h1>
                                <p style={{margin:'2px 0 0', color:'rgba(255,255,255,0.8)', fontSize:'0.875rem'}}>
                                    Discovery Vitality South Africa • Official Guide
                                </p>
                            </div>
                        </div>

                        {/* Controls */}
                        <div style={{display:'flex', alignItems:'center', gap:10}}>
                            {/* Theme toggle */}
                            <div style={{display:'flex', border:'1px solid rgba(255,255,255,0.4)',
                                         borderRadius:999, overflow:'hidden'}}>
                                {[['light','fa-sun'],['dark','fa-moon'],['system','fa-desktop']].map(([t,icon]) => (
                                    <button key={t} onClick={() => setT(t)}
                                        style={{padding:'8px 14px', background: theme===t ? 'white' : 'transparent',
                                                color: theme===t ? '#00a3e0' : 'white',
                                                border:'none', cursor:'pointer', fontSize:'0.875rem',
                                                transition:'background 0.15s, color 0.15s'}}>
                                        <i className={`fa-solid ${icon}`}></i>
                                    </button>
                                ))}
                            </div>

                            <a href="https://www.discovery.co.za/assets/discoverycoza/vitality/how-to-join/points-and-partners.pdf"
                               target="_blank"
                               style={{display:'flex', alignItems:'center', gap:6,
                                       background:'rgba(255,255,255,0.9)', color:'#00a3e0',
                                       padding:'9px 18px', borderRadius:14, fontWeight:600,
                                       fontSize:'0.875rem', textDecoration:'none', whiteSpace:'nowrap',
                                       transition:'background 0.15s'}}>
                                <i className="fa-solid fa-file-pdf"></i> PDF
                            </a>
                        </div>
                    </div>

                    {/* DOB Panel */}
                    <div style={{marginTop:28, background:'rgba(255,255,255,0.12)', backdropFilter:'blur(12px)',
                                 borderRadius:24, padding:'24px 28px', border:'1px solid rgba(255,255,255,0.25)'}}>
                        <div style={{display:'flex', flexWrap:'wrap', gap:20, alignItems:'center'}}>
                            <div style={{flex:'1 1 220px'}}>
                                <h2 style={{margin:0, color:'white', fontSize:'1.1rem', fontWeight:600}}>
                                    Personal Heart Rate Zones
                                </h2>
                                <p style={{margin:'4px 0 0', color:'rgba(255,255,255,0.75)', fontSize:'0.85rem'}}>
                                    Enter your date of birth for exact BPM values in the fitness tables
                                </p>
                            </div>
                            <div style={{flex:'1 1 220px'}}>
                                <input type="date" value={dob}
                                    onChange={e => { setDob(e.target.value); calcHR(e.target.value); }}
                                    className="themed-input"
                                    style={{width:'100%', padding:'12px 16px', borderRadius:14,
                                            fontSize:'1rem', border:'1px solid rgba(255,255,255,0.3)',
                                            background:'rgba(255,255,255,0.95)', color:'#111827'}} />
                            </div>
                        </div>

                        {maxHR && (
                            <div style={{marginTop:20, background:'var(--bg-card)', borderRadius:18,
                                         padding:'20px 24px', color:'var(--text-primary)'}}>
                                <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))', gap:20}}>
                                    <div>
                                        <div style={{fontSize:'0.72rem', color:'var(--text-muted)', letterSpacing:'0.08em', fontWeight:600}}>AGE</div>
                                        <div style={{fontSize:'3.2rem', fontWeight:800, color:'var(--accent)', lineHeight:1}}>{age}</div>
                                    </div>
                                    <div>
                                        <div style={{fontSize:'0.72rem', color:'var(--text-muted)', letterSpacing:'0.08em', fontWeight:600}}>MAX HR</div>
                                        <div style={{fontSize:'3.2rem', fontWeight:800, lineHeight:1}}>{maxHR}</div>
                                        <div style={{fontSize:'0.72rem', color:'var(--text-muted)', marginTop:2}}>BPM (220 − {age})</div>
                                    </div>
                                    <div style={{gridColumn:'span 2'}}>
                                        <div style={{fontSize:'0.72rem', color:'var(--text-muted)', letterSpacing:'0.08em', fontWeight:600, marginBottom:10}}>YOUR ZONES</div>
                                        <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10}}>
                                            {[
                                                ['60–69%', z.z60_69, 'var(--bg-success)', 'var(--text-success)'],
                                                ['70–79%', z.z70_79, 'var(--bg-warn)',    'var(--text-warn)'],
                                                ['80%+',   z.z80p,   'var(--bg-orange)', 'var(--text-orange)'],
                                            ].map(([label, val, bg, tc]) => (
                                                <div key={label} style={{background:bg, borderRadius:14, padding:'10px 8px', textAlign:'center'}}>
                                                    <div style={{fontSize:'0.7rem', fontWeight:600, color:tc, marginBottom:4}}>{label}</div>
                                                    <div style={{fontFamily:'monospace', fontSize:'0.95rem', fontWeight:700}}>{val}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            </div>

            {/* ── MAIN ── */}
            <div style={{maxWidth:1100, margin:'0 auto', padding:'32px 20px'}}>

                {/* Nav pills */}
                <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:36,
                             borderBottom:'1px solid var(--border)', paddingBottom:20}}>
                    {[['#health','Health Check'],['#screenings','Screenings'],['#fitness','Fitness'],
                      ['#eating','Eat Healthy'],['#family','Family'],['#vaccinations','Vaccinations'],
                      ['#chronic','Chronic'],['#status','Status Levels']].map(([h,l]) => (
                        <a key={h} href={h} className="nav-pill">{l}</a>
                    ))}
                </div>


                {/* ══ 01 HEALTH CHECK ══ */}
                <SectionCard id="health" icon="📋"
                    title="01 • Online Assessments & Vitality Health Check"
                    subtitle="Max 25,000 points per year • Members 18+">

                    <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))', gap:24}}>
                        <div>
                            <h3 style={{margin:'0 0 12px', fontSize:'0.95rem', fontWeight:600}}>Online Assessments</h3>
                            <ListRow label="Vitality Age assessment" pts="1,500 once/year" />
                            <ListRow label="Mental Wellbeing Assessments"
                                     pts="500 × 2 = 1,000/year"
                                     note="Assessments must be 6 months apart to earn both" />
                        </div>
                        <div>
                            <h3 style={{margin:'0 0 8px', fontSize:'0.95rem', fontWeight:600}}>Vitality Health Check (5 measures)</h3>
                            <p style={{margin:'0 0 10px', fontSize:'0.78rem', color:'var(--text-muted)'}}>
                                Blood pressure • Blood glucose • Cholesterol • Weight assessment • Non-smoker's declaration
                            </p>
                            <Tbl>
                                <thead><tr className="v-thead">
                                    <th style={{textAlign:'left',padding:'10px 14px',fontSize:'0.78rem',color:'var(--text-secondary)'}}>In-range</th>
                                    <th style={{textAlign:'center',padding:'10px 14px',fontSize:'0.78rem',color:'var(--text-secondary)'}}>0 high-risk</th>
                                    <th style={{textAlign:'center',padding:'10px 14px',fontSize:'0.78rem',color:'var(--text-secondary)'}}>1+ high-risk</th>
                                </tr></thead>
                                <tbody>
                                    {[['5','22,500','—'],['4','15,000','5,000'],['3','10,000','5,000'],
                                      ['2','7,500','5,000'],['1','5,000','5,000']].map(([n,a,b]) => (
                                        <tr key={n} className="tbl-row">
                                            <td style={{padding:'9px 14px'}}>{n}</td>
                                            <td style={{padding:'9px 14px',textAlign:'center',fontWeight:600,color:'var(--accent)'}}>{a}</td>
                                            <td style={{padding:'9px 14px',textAlign:'center',fontWeight:600,color: b==='—' ? 'var(--text-muted)' : 'var(--accent)'}}>{b}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </Tbl>
                            <p style={{fontSize:'0.72rem',color:'var(--text-muted)',marginTop:6}}>
                                Partial: 4 results = 5,000 • 3 results = 2,500 • &lt;3 = 0 &nbsp;|&nbsp; Re-tests must be ≥90 days apart
                            </p>
                        </div>
                    </div>

                    <div className="v-info" style={{borderRadius:14, padding:'14px 18px', marginTop:18, fontSize:'0.875rem'}}>
                        <strong>🏅 Vitality 65+ Extras:</strong> Falls risk assessment <Pts v="500 pts" /> (counts towards 22,500 max) •
                        Vitality Functional Assessment <Pts v="2,500 pts/year" /> • Completing VHC for 65+ unlocks a personalised clinical report
                    </div>
                </SectionCard>


                {/* ══ 02 SCREENINGS ══ */}
                <SectionCard id="screenings" icon="🔬"
                    title="02 • Additional Screenings"
                    subtitle="Age & gender specific">
                    <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))', gap:'0 32px'}}>
                        {[
                            ['Colon cancer screening (45+)', '2,500 once/year', 'Colonoscopy / FIT / FOBT — colonoscopy carries over 10 years'],
                            ['Bone mass density (women 65+, men 70+)', '2,500 once/2 years', 'DEXA scan — valid for both years'],
                            ['Mammogram (women 40+)', '2,500 once/2 years', 'Points carry over to following year'],
                            ['Pap smear (women 25–65)', '2,500', 'Once/3 years — carries over'],
                            ['HPV cervical cancer test (women 25–65)', '2,500', 'Alternative to Pap smear — once/5 years. Points for one or the other only'],
                            ['Dental check-up', '1,000 once/year', null],
                            ['Glaucoma / vision test (60+)', '1,000 once/year', 'One of the two tests — whichever comes first'],
                            ['Hearing test (65+ only)', '1,000 once in lifetime', 'Audiologist or Acoustician'],
                            ['Optometrist (65+ only)', 'Up to 3,500 once/year', null],
                            ['Tdap vaccine (65+)', 'Points awarded', 'Bring GP script to VHC for 65+'],
                            ['Premier PLUS GP consult (65+ only)', 'Up to 2,500 once/year', null],
                            ['First HIV test (18+)', '7,500 once in lifetime', null],
                            ['HIV counselling & testing — subsequent years (18+)', '1,000 once/year', null],
                        ].map(([l,p,n]) => <BetweenRow key={l} label={<span>{l}{n && <span style={{display:'block',fontSize:'0.72rem',color:'var(--text-muted)',marginTop:2}}>{n}</span>}</span>} pts={p} />)}
                    </div>
                </SectionCard>


                {/* ══ 03 FITNESS ══ */}
                <SectionCard id="fitness" icon="🏃"
                    title="03 • Earn Points for Getting Active"
                    subtitle="One activity per day (highest wins) • Max 25,000 fitness pts/year + 10,000 Cardio Fitness Level pts (separate)">

                    {/* Cardio Fitness Level */}
                    <div className="v-info" style={{borderRadius:16, padding:'16px 20px', marginBottom:20}}>
                        <div style={{fontWeight:600, marginBottom:8}}>
                            💙 Vitality Cardio Fitness Level (VO₂ max) — up to 10,000 pts/year — separate from 25,000 cap
                        </div>

                    <h3 style={{margin:'0 0 10px', fontSize:'1rem', fontWeight:600}}>Ages 65+</h3>

                        <THead cols={['Activity','Points']} />

                            <TR label="Vitality online workout (30+ min)" pts="50"  cap={true} />

                    </div>
                </SectionCard>


                {/* ══ 07 CHRONIC ══ */}
                <SectionCard id="chronic" icon="🩺"

                    <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:18}}>
                        {['Diabetes','High blood pressure','Hyperlipidaemia','Ischemic heart disease'].map(c => (
                            <span key={c} className="v-info"
                                  style={{padding:'6px 16px', borderRadius:999, fontSize:'0.875rem', fontWeight:500}}>

                    <p style={{fontSize:'1.5rem', fontWeight:800, color:'var(--accent)', margin:0}}>
                        Up to 2,500 points per year

                                <th key={l} style={{padding:'12px 10px',textAlign:'center',fontSize:'0.8rem',color:c,fontWeight:700}}>
                                    {e} {l}
                                </th>
                            ))}
                        </tr></thead>
                        <tbody>
                            {[
                                ['Single member',             'Start','7,500','25,000','40,000','50,000'],
                                ['Main + 1 adult (18+)',      'Start','15,000','50,000','80,000','100,000'],
                                ['Main + 2 adults (18+)',     'Start','18,750','62,500','100,000','125,000'],
                            ].map(([label,...vals]) => (
                                <tr key={label} className="tbl-row">
                                    <td style={{padding:'12px 16px',fontWeight:500}}>{label}</td>
                                    {vals.map((v,i) => (
                                        <td key={i} style={{padding:'12px 10px',textAlign:'center',

                                            {v}

                        </tbody>
                    </Tbl>
                    <p style={{fontSize:'0.72rem',color:'var(--text-muted)',marginTop:8}}>

                    <div className="v-warn" style={{borderRadius:14, padding:'14px 18px', marginTop:16, fontSize:'0.875rem'}}>

                    </div>
                </SectionCard>


                {/* Footer */}
                <p style={{textAlign:'center', fontSize:'0.72rem', color:'var(--text-muted)', marginTop:8, paddingBottom:48}}>
                    All data sourced from the official Discovery Vitality Points &amp; Partners PDF (RCK_1158654DHV_02/12/2026_V1) •
