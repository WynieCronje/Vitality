<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitality Points Explorer • Discovery Vitality</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .header-bg { background: linear-gradient(90deg, #00a3e0, #0077b6); }
        .section-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .section-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); }
        table { border-collapse: collapse; }
        .dark .section-card { background-color: #1f2937; }
        .dark .section-card table thead { background-color: #374151; }
        .dark .bg-gray-50 { background-color: #111827; }
        .dark .bg-white { background-color: #1f2937; }
        .dark .border { border-color: #374151; }
        .dark .text-gray-600 { color: #9ca3af; }
        .dark .text-gray-500 { color: #9ca3af; }
        .dark .divide-y > * { border-color: #374151; }
        .dark table thead { background-color: #374151 !important; }
        .dark .bg-gray-100 { background-color: #374151; }
        .dark .bg-amber-50 { background-color: #422006; }
        .dark .bg-green-50 { background-color: #14532d; }
        .dark .bg-yellow-50 { background-color: #422006; }
        .dark .bg-orange-50 { background-color: #431407; }
        .dark .bg-blue-50 { background-color: #1e3a5f; }
        .dark .bg-purple-50 { background-color: #3b0764; }
        .dark .bg-emerald-50 { background-color: #022c22; }
        .dark .border-gray-200 { border-color: #374151; }
        .dark .text-gray-900 { color: #f9fafb; }
        .dark .text-gray-700 { color: #d1d5db; }
        .badge-new { background: #fef3c7; color: #92400e; font-size: 0.6rem; padding: 1px 6px; border-radius: 999px; font-weight: 600; vertical-align: middle; margin-left: 6px; }
        .dark .badge-new { background: #78350f; color: #fef3c7; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [dob, setDob] = React.useState('');
            const [age, setAge] = React.useState(null);
            const [maxHR, setMaxHR] = React.useState(null);
            const [zones, setZones] = React.useState({
                zone60_69: '60–69%',
                zone70_79: '70–79%',
                zone80plus: '80%+',
                zone60plus: '60%+',
                zone70plus: '70%+'
            });
            const [theme, setTheme] = React.useState('system');

            useEffect(() => {
                const savedDOB = localStorage.getItem('vitalityDOB');
                if (savedDOB) { setDob(savedDOB); calculateHR(savedDOB); }
                const savedTheme = localStorage.getItem('vitalityTheme');
                if (savedTheme) { setTheme(savedTheme); applyTheme(savedTheme); } else { applyTheme('system'); }
            }, []);

            function calculateHR(dobInput) {
                if (!dobInput) {
                    setAge(null); setMaxHR(null);
                    setZones({ zone60_69: '60–69%', zone70_79: '70–79%', zone80plus: '80%+', zone60plus: '60%+', zone70plus: '70%+' });
                    return;
                }
                const dobDate = new Date(dobInput);
                const today = new Date();
                let calculatedAge = today.getFullYear() - dobDate.getFullYear();
                if (today.getMonth() < dobDate.getMonth() || (today.getMonth() === dobDate.getMonth() && today.getDate() < dobDate.getDate())) calculatedAge--;
                const calculatedMaxHR = Math.round(220 - calculatedAge);
                const z60 = Math.round(calculatedMaxHR * 0.60);
                const z69 = Math.round(calculatedMaxHR * 0.69);
                const z70 = Math.round(calculatedMaxHR * 0.70);
                const z79 = Math.round(calculatedMaxHR * 0.79);
                const z80 = Math.round(calculatedMaxHR * 0.80);
                setAge(calculatedAge);
                setMaxHR(calculatedMaxHR);
                setZones({
                    zone60_69: `${z60}–${z69} BPM`,
                    zone70_79: `${z70}–${z79} BPM`,
                    zone80plus: `≥${z80} BPM`,
                    zone60plus: `≥${z60} BPM`,
                    zone70plus: `≥${z70} BPM`
                });
                localStorage.setItem('vitalityDOB', dobInput);
            }

            function handleDOBChange(e) { const v = e.target.value; setDob(v); calculateHR(v); }

            function applyTheme(t) {
                const html = document.documentElement;
                if (t === 'dark') html.classList.add('dark');
                else if (t === 'light') html.classList.remove('dark');
                else { window.matchMedia('(prefers-color-scheme: dark)').matches ? html.classList.add('dark') : html.classList.remove('dark'); }
                localStorage.setItem('vitalityTheme', t);
            }

            function changeTheme(t) { setTheme(t); applyTheme(t); }

            const hasDOB = !!maxHR;

            const pts = (n) => <span className="font-semibold text-[#00a3e0]">{n}</span>;

            function TableRow({ label, points, cap }) {
                return (
                    <tr>
                        <td className="px-6 py-4">
                            {label}
                            {cap && <span className="badge-new">CAPPED</span>}
                        </td>
                        <td className="text-right px-6 py-4 font-semibold text-[#00a3e0]">{points}</td>
                    </tr>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100">

                    {/* HEADER */}
                    <div className="header-bg text-white pb-8 md:pb-12">
                        <div className="max-w-7xl mx-auto px-4 md:px-6 pt-6 md:pt-8">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                                <div className="flex items-center gap-x-4">
                                    <i className="fa-solid fa-heart-pulse text-5xl"></i>
                                    <div>
                                        <h1 className="text-3xl md:text-4xl font-semibold tracking-tight">Vitality Points Explorer</h1>
                                        <p className="text-blue-100 mt-1 text-sm md:text-base">Discovery Vitality South Africa • Official Guide</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-4">
                                    <div className="flex border border-white/30 rounded-3xl overflow-hidden">
                                        <button onClick={() => changeTheme('light')} className={`px-4 py-2 text-sm ${theme === 'light' ? 'bg-white text-[#00a3e0]' : 'hover:bg-white/10'}`}><i className="fa-solid fa-sun"></i></button>
                                        <button onClick={() => changeTheme('dark')} className={`px-4 py-2 text-sm ${theme === 'dark' ? 'bg-white text-[#00a3e0]' : 'hover:bg-white/10'}`}><i className="fa-solid fa-moon"></i></button>
                                        <button onClick={() => changeTheme('system')} className={`px-4 py-2 text-sm ${theme === 'system' ? 'bg-white text-[#00a3e0]' : 'hover:bg-white/10'}`}><i className="fa-solid fa-desktop"></i></button>
                                    </div>
                                    <a href="https://www.discovery.co.za/assets/discoverycoza/vitality/how-to-join/points-and-partners.pdf" target="_blank"
                                       className="flex items-center gap-x-2 bg-white/90 text-[#00a3e0] px-5 py-3 rounded-2xl font-semibold hover:bg-white text-sm md:text-base whitespace-nowrap">
                                        <i className="fa-solid fa-file-pdf"></i> PDF
                                    </a>
                                </div>
                            </div>

                            {/* DOB */}
                            <div className="mt-8 md:mt-10 bg-white/10 backdrop-blur-xl rounded-3xl p-6 md:p-8 border border-white/30">
                                <div className="flex flex-col md:flex-row gap-6">
                                    <div className="flex-1">
                                        <h2 className="text-xl md:text-2xl font-semibold">Personal Heart Rate Zones</h2>
                                        <p className="text-blue-100 mt-2 text-sm md:text-base">Enter your date of birth for exact BPM values in the fitness tables below</p>
                                    </div>
                                    <div className="flex-1">
                                        <input type="date" value={dob} onChange={handleDOBChange}
                                            className="w-full bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 rounded-2xl px-5 py-4 text-base focus:outline-none focus:ring-4 focus:ring-white/50" />
                                    </div>
                                </div>
                                {hasDOB && (
                                    <div className="mt-8 bg-white dark:bg-gray-800 rounded-3xl p-6 md:p-8 text-gray-900 dark:text-gray-100">
                                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6 md:gap-8">
                                            <div>
                                                <div className="text-xs md:text-sm text-gray-500 dark:text-gray-400">AGE</div>
                                                <div className="text-5xl md:text-6xl font-bold text-[#00a3e0]">{age}</div>
                                            </div>
                                            <div>
                                                <div className="text-xs md:text-sm text-gray-500 dark:text-gray-400">MAX HR</div>
                                                <div className="text-5xl md:text-6xl font-bold">{maxHR} BPM</div>
                                                <div className="text-xs text-gray-400 mt-1">220 − {age}</div>
                                            </div>
                                            <div className="md:col-span-2">
                                                <div className="text-sm font-medium mb-3">YOUR ZONES</div>
                                                <div className="grid grid-cols-3 gap-3 md:gap-4">
                                                    <div className="text-center bg-green-50 dark:bg-green-900/30 rounded-2xl py-3 md:py-4">
                                                        <div className="text-green-600 dark:text-green-400 text-xs font-medium">60–69%</div>
                                                        <div className="font-mono text-lg md:text-xl font-semibold">{zones.zone60_69}</div>
                                                    </div>
                                                    <div className="text-center bg-yellow-50 dark:bg-yellow-900/30 rounded-2xl py-3 md:py-4">
                                                        <div className="text-yellow-600 dark:text-yellow-400 text-xs font-medium">70–79%</div>
                                                        <div className="font-mono text-lg md:text-xl font-semibold">{zones.zone70_79}</div>
                                                    </div>
                                                    <div className="text-center bg-orange-50 dark:bg-orange-900/30 rounded-2xl py-3 md:py-4">
                                                        <div className="text-orange-600 dark:text-orange-400 text-xs font-medium">80%+</div>
                                                        <div className="font-mono text-lg md:text-xl font-semibold">{zones.zone80plus}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* MAIN */}
                    <div className="max-w-7xl mx-auto px-4 md:px-6 py-8 md:py-12">

                        {/* NAV PILLS */}
                        <div className="flex flex-wrap gap-2 mb-10 border-b pb-6 overflow-x-auto">
                            {[
                                ['#health','Health Check'],
                                ['#screenings','Screenings'],
                                ['#fitness','Fitness'],
                                ['#eating','Eat Healthy'],
                                ['#family','Family'],
                                ['#vaccinations','Vaccinations'],
                                ['#chronic','Chronic'],
                                ['#status','Status Thresholds'],
                            ].map(([href, label]) => (
                                <a key={href} href={href} className="nav-pill bg-white dark:bg-gray-800 shadow-sm border border-gray-200 dark:border-gray-700 hover:border-[#00a3e0] px-5 py-2.5 rounded-3xl text-sm font-medium whitespace-nowrap">{label}</a>
                            ))}
                        </div>

                        {/* ===== 01 ONLINE ASSESSMENTS & HEALTH CHECK ===== */}
                        <div id="health" className="section-card bg-white dark:bg-gray-800 rounded-3xl p-6 md:p-8 mb-8 md:mb-12">
                            <div className="flex items-center gap-x-4 mb-6">
                                <div className="w-11 h-11 bg-[#00a3e0] text-white rounded-2xl flex items-center justify-center text-2xl">📋</div>
                                <div>
                                    <h2 className="text-2xl md:text-3xl font-semibold">01 • Online Assessments &amp; Vitality Health Check</h2>
                                    <p className="text-gray-500 dark:text-gray-400">Max 25,000 points per year • Members 18+</p>
                                </div>
                            </div>

                            <div className="grid md:grid-cols-2 gap-8">
                                {/* Online Assessments */}
                                <div>
                                    <h3 className="font-semibold mb-4 text-lg">Online Assessments</h3>
                                    <ul className="space-y-3 text-sm">
                                        <li className="flex justify-between bg-gray-50 dark:bg-gray-700 p-4 rounded-2xl">
                                            <span>Vitality Age assessment</span>
                                            <span className="font-semibold text-[#00a3e0]">1,500 once/year</span>
                                        </li>
                                        <li className="bg-gray-50 dark:bg-gray-700 p-4 rounded-2xl">
                                            <div className="flex justify-between">
                                                <span>Mental Wellbeing Assessments</span>
                                                <span className="font-semibold text-[#00a3e0]">500 × 2 = 1,000/year</span>
                                            </div>
                                            <div className="text-xs text-gray-500 dark:text-gray-400 mt-1">Assessments must be 6 months apart to earn both</div>
                                        </li>
                                    </ul>
                                </div>

                                {/* VHC Table */}
                                <div>
                                    <h3 className="font-semibold mb-4 text-lg">Vitality Health Check (5 measures)</h3>
                                    <p className="text-xs text-gray-500 dark:text-gray-400 mb-3">Measures: blood pressure, blood glucose, cholesterol, weight assessment, non-smoker's declaration</p>
                                    <div className="overflow-x-auto rounded-2xl border dark:border-gray-700">
                                        <table className="w-full text-sm">
                                            <thead className="bg-gray-100 dark:bg-gray-700">
                                                <tr>
                                                    <th className="text-left px-4 py-3">In-range results</th>
                                                    <th className="px-4 py-3">0 high-risk</th>
                                                    <th className="px-4 py-3">1+ high-risk</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y dark:divide-gray-700 text-center">
                                                <tr><td className="px-4 py-3 text-left">5</td><td className="font-semibold text-[#00a3e0]">22,500</td><td>—</td></tr>
                                                <tr><td className="px-4 py-3 text-left">4</td><td className="font-semibold text-[#00a3e0]">15,000</td><td className="font-semibold text-[#00a3e0]">5,000</td></tr>
                                                <tr><td className="px-4 py-3 text-left">3</td><td className="font-semibold text-[#00a3e0]">10,000</td><td className="font-semibold text-[#00a3e0]">5,000</td></tr>
                                                <tr><td className="px-4 py-3 text-left">2</td><td className="font-semibold text-[#00a3e0]">7,500</td><td className="font-semibold text-[#00a3e0]">5,000</td></tr>
                                                <tr><td className="px-4 py-3 text-left">1</td><td className="font-semibold text-[#00a3e0]">5,000</td><td className="font-semibold text-[#00a3e0]">5,000</td></tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    <p className="text-xs text-gray-500 dark:text-gray-400 mt-3">
                                        Partial check: 4 results = 5,000 pts • 3 results = 2,500 pts • Fewer than 3 = 0 pts
                                    </p>
                                    <p className="text-xs text-gray-500 dark:text-gray-400 mt-2">
                                        Re-tests for out-of-range results: points only if tests are at least 90 days apart.
                                    </p>
                                </div>
                            </div>

                            {/* Vitality 65+ extras */}
                            <div className="mt-6 bg-blue-50 dark:bg-blue-900/20 rounded-2xl p-5 text-sm">
                                <div className="font-semibold mb-2 text-blue-800 dark:text-blue-300">🏅 Vitality 65+ Additional Features</div>
                                <ul className="space-y-1 text-gray-700 dark:text-gray-300">
                                    <li>• Falls risk assessment (part of VHC for 65+): <span className="font-semibold text-[#00a3e0]">500 pts</span> — counts towards 22,500 max</li>
                                    <li>• Vitality Functional Assessment: <span className="font-semibold text-[#00a3e0]">2,500 pts once/year</span></li>
                                    <li>• Completing VHC for 65+ gives access to a personalised clinical report with risk areas and recommendations</li>
                                </ul>
                            </div>
                        </div>

                        {/* ===== 02 SCREENINGS ===== */}
                        <div id="screenings" className="section-card bg-white dark:bg-gray-800 rounded-3xl p-6 md:p-8 mb-8 md:mb-12">
                            <div className="flex items-center gap-x-4 mb-6">
                                <div className="w-11 h-11 bg-[#00a3e0] text-white rounded-2xl flex items-center justify-center text-2xl">🔬</div>
                                <h2 className="text-2xl md:text-3xl font-semibold">02 • Additional Screenings (age &amp; gender specific)</h2>
                            </div>
                            <div className="grid md:grid-cols-2 gap-y-3 gap-x-6 text-sm">
                                <div className="flex justify-between py-2 border-b dark:border-gray-700">
                                    <span>Colon cancer screening (45+) <span className="text-xs text-gray-400">colonoscopy/FIT/FOBT</span></span>
                                    <span className="font-semibold text-[#00a3e0] ml-4 text-right">2,500 once/year</span>
                                </div>
                                <div className="flex justify-between py-2 border-b dark:border-gray-700">
                                    <span>Bone mass density (women 65+, men 70+) <span className="text-xs text-gray-400">DEXA scan</span></span>
                                    <span className="font-semibold text-[#00a3e0] ml-4 text-right">2,500 once/2 years</span>
                                </div>
                                <div className="flex justify-between py-2 border-b dark:border-gray-700">
                                    <span>Mammogram (women 40+)</span>
                                    <span className="font-semibold text-[#00a3e0] ml-4 text-right">2,500 once/2 years</span>
                                </div>
                                <div className="flex justify-between py-2 border-b dark:border-gray-700">
                                    <span>Pap smear (women 25–65) <span className="text-xs text-gray-400">once/3 years</span></span>
                                    <span className="font-semibold text-[#00a3e0] ml-4 text-right">2,500</span>
                                </div>
                                <div className="flex justify-between py-2 border-b dark:border-gray-700">
                                    <span>HPV cervical cancer test (women 25–65) <span className="text-xs text-gray-400">alternative to Pap — once/5 years</span></span>
                                    <span className="font-semibold text-[#00a3e0] ml-4 text-right">2,500</span>
                                </div>
                                <div className="flex justify-between py-2 border-b dark:border-gray-700">
                                    <span>Dental check-up</span>
                                    <span className="font-semibold text-[#00a3e0] ml-4 text-right">1,000 once/year</span>
                                </div>
                                <div className="flex justify-between py-2 border-b dark:border-gray-700">
                                    <span>Glaucoma / vision test (60+) <span className="text-xs text-gray-400">one of the two tests, whichever first</span></span>
                                    <span className="font-semibold text-[#00a3e0] ml-4 text-right">1,000 once/year</span>
                                </div>
                                <div className="flex justify-between py-2 border-b dark:border-gray-700">
                                    <span>Hearing test (65+ only) <span className="text-xs text-gray-400">Audiologist or Acoustician</span></span>
                                    <span className="font-semibold text-[#00a3e0] ml-4 text-right">1,000 once in lifetime</span>
                                </div>
                                <div className="flex justify-between py-2 border-b dark:border-gray-700">
                                    <span>Optometrist (65+ only)</span>
                                    <span className="font-semibold text-[#00a3e0] ml-4 text-right">Up to 3,500 once/year</span>
                                </div>
                                <div className="flex justify-between py-2 border-b dark:border-gray-700">
                                    <span>Tdap vaccine (65+) <span className="text-xs text-gray-400">bring GP script to VHC for 65+</span></span>
                                    <span className="font-semibold text-[#00a3e0] ml-4 text-right">Points awarded</span>
                                </div>
                                <div className="flex justify-between py-2 border-b dark:border-gray-700">
                                    <span>Premier PLUS GP consult (65+ only)</span>
                                    <span className="font-semibold text-[#00a3e0] ml-4 text-right">Up to 2,500 once/year</span>
                                </div>
                                <div className="flex justify-between py-2 border-b dark:border-gray-700">
                                    <span>First HIV test (18+)</span>
                                    <span className="font-semibold text-[#00a3e0] ml-4 text-right">7,500 once in lifetime</span>
                                </div>
                                <div className="flex justify-between py-2 border-b dark:border-gray-700">
                                    <span>HIV counselling &amp; testing — subsequent years (18+)</span>
                                    <span className="font-semibold text-[#00a3e0] ml-4 text-right">1,000 once/year</span>
                                </div>
                            </div>
                            <div className="mt-4 text-xs text-gray-500 dark:text-gray-400 space-y-1">
                                <p>* Pap smear and HPV test — points awarded for one or the other, not both. Pap smear points carry over 3 years; HPV test carries over 5 years.</p>
                                <p>* Colonoscopy points carry over for 10 years. FIT/FOBT earns 2,500 pts once only (not annually).</p>
                            </div>
                        </div>

                        {/* ===== 03 FITNESS ===== */}
                        <div id="fitness" className="section-card bg-white dark:bg-gray-800 rounded-3xl p-6 md:p-8 mb-8 md:mb-12">
                            <div className="flex items-center gap-x-4 mb-6">
                                <div className="w-11 h-11 bg-[#00a3e0] text-white rounded-2xl flex items-center justify-center text-2xl">🏃</div>
                                <div>
                                    <h2 className="text-2xl md:text-3xl font-semibold">03 • Earn Points for Getting Active</h2>
                                    <p className="text-gray-500 dark:text-gray-400">One activity per day (highest wins) • Max 25,000 fitness pts/year + 10,000 Cardio Fitness Level pts</p>
                                </div>
                            </div>

                            {/* Cardio Fitness Level */}
                            <div className="mb-8 bg-blue-50 dark:bg-blue-900/20 rounded-2xl p-5">
                                <h3 className="font-semibold mb-3 text-blue-800 dark:text-blue-300">💙 Vitality Cardio Fitness Level (VO₂ max) — up to 10,000 pts/year (separate from 25,000 cap)</h3>
                                <p className="text-xs text-gray-600 dark:text-gray-400 mb-3">Requires 5 device readings or a Vitality Fitness Assessment (VFA). Measured via compatible fitness watches or VFA.</p>
                                <div className="grid grid-cols-5 gap-2 text-sm text-center">
                                    {[['Superior','10,000'],['Excellent','7,000'],['Good','4,500'],['Fair','2,500'],['Low','1,000']].map(([level, pts]) => (
                                        <div key={level} className="bg-white dark:bg-gray-700 rounded-xl py-3 px-2">
                                            <div className="text-xs text-gray-500 dark:text-gray-400">{level}</div>
                                            <div className="font-bold text-[#00a3e0]">{pts}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Speed workout info */}
                            <div className="mb-6 bg-green-50 dark:bg-green-900/20 rounded-2xl p-5 text-sm">
