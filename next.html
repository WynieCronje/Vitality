<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitality Points Explorer • Discovery Vitality</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; -webkit-text-size-adjust: 100%; }
        img, table { max-width: 100%; }

        /* ── LIGHT ── */
        :root {
            --bg-page:       #f3f4f6;
            --bg-card:       #ffffff;
            --bg-subtle:     #f9fafb;
            --bg-row-alt:    #f3f4f6;
            --bg-thead:      #f3f4f6;
            --bg-info:       #eff6ff;
            --bg-success:    #f0fdf4;
            --bg-warn:       #fffbeb;
            --bg-orange:     #fff7ed;
            --bg-purple:     #faf5ff;
            --bg-red:        #fef2f2;
            --text-primary:  #111827;
            --text-secondary:#6b7280;
            --text-muted:    #9ca3af;
            --text-info:     #1d4ed8;
            --text-success:  #15803d;
            --text-warn:     #92400e;
            --text-orange:   #c2410c;
            --text-purple:   #7e22ce;
            --border:        #e5e7eb;
            --accent:        #00a3e0;
        }

        /* ── DARK ── */
        html.dark {
            --bg-page:       #0f172a;
            --bg-card:       #1e293b;
            --bg-subtle:     #263346;
            --bg-row-alt:    #263346;
            --bg-thead:      #263346;
            --bg-info:       #1e3a5f;
            --bg-success:    #052e16;
            --bg-warn:       #422006;
            --bg-orange:     #431407;
            --bg-purple:     #2e1065;
            --bg-red:        #450a0a;
            --text-primary:  #f1f5f9;
            --text-secondary:#94a3b8;
            --text-muted:    #64748b;
            --text-info:     #93c5fd;
            --text-success:  #86efac;
            --text-warn:     #fde68a;
            --text-orange:   #fdba74;
            --text-purple:   #d8b4fe;
            --border:        #334155;
            --accent:        #38bdf8;
        }

        body { background: var(--bg-page); color: var(--text-primary); }

        /* ── Utility classes ── */
        .v-card    { background: var(--bg-card); }
        .v-subtle  { background: var(--bg-subtle); }
        .v-thead   { background: var(--bg-thead); }
        .v-info    { background: var(--bg-info);   color: var(--text-info); }
        .v-success { background: var(--bg-success);color: var(--text-success); }
        .v-warn    { background: var(--bg-warn);   color: var(--text-warn); }
        .v-orange  { background: var(--bg-orange); color: var(--text-orange); }
        .v-purple  { background: var(--bg-purple); color: var(--text-purple); }
        .v-red     { background: var(--bg-red);    color: #b91c1c; }
        html.dark .v-red { color: #fca5a5; }

        /* ── Header ── */
        .header-bg { background: linear-gradient(135deg, #00a3e0 0%, #0077b6 100%); }
        html.dark .header-bg { background: linear-gradient(135deg, #0c4a6e 0%, #082f49 100%); }

        /* ── Section cards ── */
        .section-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px 16px;
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        @media (min-width: 640px) {
            .section-card { padding: 24px 28px; margin-bottom: 28px; border-radius: 24px; }
        }
        @media (min-width: 640px) {
            .section-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 20px 40px -8px rgba(0,0,0,0.12);
            }
        }

        /* ── Tables ── */
        table { border-collapse: collapse; width: 100%; }
        .tbl-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 4px; -webkit-overflow-scrolling: touch; }
        .tbl-row { border-bottom: 1px solid var(--border); }
        .tbl-row:last-child { border-bottom: none; }
        .tbl-row:hover { background: var(--bg-row-alt); }

        /* ── Badge ── */
        .badge-cap {
            display: inline-block;
            background: #fef9c3; color: #854d0e;
            font-size: 0.58rem; padding: 1px 5px;
            border-radius: 999px; font-weight: 700;
            vertical-align: middle; margin-left: 5px;
            letter-spacing: 0.03em; white-space: nowrap;
        }
        html.dark .badge-cap { background: #713f12; color: #fef9c3; }

        /* ── Nav pills ── */
        .nav-pill {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
            transition: border-color 0.15s, color 0.15s;
            flex-shrink: 0;
        }
        .nav-pill:hover { border-color: var(--accent); color: var(--accent); }

        /* ── Info boxes ── */
        .info-box { border-radius: 14px; padding: 14px 16px; font-size: 0.875rem; }

        /* ── List row ── */
        .list-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 11px 14px; border-radius: 12px;
            background: var(--bg-subtle);
            margin-bottom: 8px; gap: 10px; font-size: 0.875rem;
        }
        .list-row-pts { font-weight: 600; color: var(--accent); white-space: nowrap; flex-shrink: 0; }
        .list-row-note { display: block; font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

        /* ── Between row (screenings / vaccinations) ── */
        .between-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 10px 0; border-bottom: 1px solid var(--border);
            font-size: 0.875rem; gap: 8px;
        }
        .between-row:last-child { border-bottom: none; }
        .between-row-pts { font-weight: 600; color: var(--accent); white-space: nowrap; flex-shrink: 0; }
        .between-row-note { display: block; font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

        /* ── Two-col grid that collapses cleanly ── */
        .two-col { display: grid; grid-template-columns: 1fr; gap: 0 28px; }
        @media (min-width: 600px) { .two-col { grid-template-columns: 1fr 1fr; } }

        /* ── DOB panel layout ── */
        .dob-row { display: flex; flex-direction: column; gap: 14px; }
        @media (min-width: 540px) { .dob-row { flex-direction: row; align-items: center; } }

        .dob-input-wrap { width: 100%; min-width: 0; }
        @media (min-width: 540px) { .dob-input-wrap { max-width: 240px; flex-shrink: 0; } }

        input[type="date"] { box-sizing: border-box; -webkit-appearance: none; appearance: none; max-width: 100%; }

        /* ── DOB glass panel ── */
        .dob-panel {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.22);
        }
        html.dark .dob-panel {
            background: rgba(15,23,42,0.35);
            border: 1px solid rgba(148,163,184,0.18);
        }
        /* white-ish input dimmed in dark mode */
        .dob-input {
            background: rgba(255,255,255,0.95);
            color: #111827;
            border: 1px solid rgba(255,255,255,0.3);
        }
        html.dark .dob-input {
            background: #1e293b !important;
            color: #f1f5f9 !important;
            border: 1px solid rgba(148,163,184,0.3) !important;
        }
        html.dark .dob-input::-webkit-calendar-picker-indicator { filter: invert(0.85); }

        /* ── HR zones result panel ── */
        .hr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (min-width: 540px) { .hr-grid { grid-template-columns: auto auto 1fr; } }

        .hr-zones-block { grid-column: 1 / -1; }
        @media (min-width: 540px) { .hr-zones-block { grid-column: auto; } }

        .zones-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

        /* ── Cardio fitness level grid ── */
        .cfl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        @media (min-width: 480px) { .cfl-grid { grid-template-columns: repeat(5, 1fr); } }

        /* ── Section title ── */
        .section-title { margin: 0; font-size: clamp(1rem, 2.5vw, 1.3rem); font-weight: 600; line-height: 1.3; }
        .section-subtitle { margin: 3px 0 0; font-size: 0.82rem; color: var(--text-secondary); }

        /* ── Header title/controls layout ── */
        .header-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
        .header-controls { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }

        /* ── Theme toggle ── */
        .theme-toggle { display: flex; border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; overflow: hidden; }
        .theme-btn {
            padding: 8px 12px; background: transparent; color: white;
            border: none; cursor: pointer; font-size: 0.8rem;
            transition: background 0.15s, color 0.15s;
        }
        .theme-btn.active { background: white; color: #00a3e0; }

        /* ── PDF link ── */
        .pdf-link {
            display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.9); color: #00a3e0;
            padding: 8px 14px; border-radius: 12px; font-weight: 600;
            font-size: 0.82rem; text-decoration: none; white-space: nowrap;
        }

        /* ── Main container ── */
        .main-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 14px; }
        @media (min-width: 640px) { .main-wrap { padding: 32px 20px; } }

        .header-inner { max-width: 1100px; margin: 0 auto; padding: 18px 14px 0; }
        @media (min-width: 640px) { .header-inner { padding: 24px 20px 0; } }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
    const [dob,    setDob]    = useState('');
    const [age,    setAge]    = useState(null);
    const [maxHR,  setMaxHR]  = useState(null);
    const [zones,  setZones]  = useState({ z60_69:'60–69%', z70_79:'70–79%', z80p:'80%+', z60p:'60%+', z70p:'70%+' });
    const [theme,  setTheme]  = useState('system');

    useEffect(() => {
        const d = localStorage.getItem('vitalityDOB');
        if (d) { setDob(d); calcHR(d); }
        const t = localStorage.getItem('vitalityTheme') || 'system';
        setTheme(t); applyTheme(t);
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        const handler = () => { if (localStorage.getItem('vitalityTheme') === 'system') applyTheme('system'); };
        mq.addEventListener('change', handler);
        return () => mq.removeEventListener('change', handler);
    }, []);

    function calcHR(d) {
        if (!d) { setAge(null); setMaxHR(null); setZones({ z60_69:'60–69%', z70_79:'70–79%', z80p:'80%+', z60p:'60%+', z70p:'70%+' }); return; }
        const born = new Date(d), today = new Date();
        let a = today.getFullYear() - born.getFullYear();
        if (today.getMonth() < born.getMonth() || (today.getMonth() === born.getMonth() && today.getDate() < born.getDate())) a--;
        const mhr = 220 - a;
        setAge(a); setMaxHR(mhr);
        setZones({
            z60_69: `${Math.round(mhr*.60)}–${Math.round(mhr*.69)} BPM`,
            z70_79: `${Math.round(mhr*.70)}–${Math.round(mhr*.79)} BPM`,
            z80p:   `≥${Math.round(mhr*.80)} BPM`,
            z60p:   `≥${Math.round(mhr*.60)} BPM`,
            z70p:   `≥${Math.round(mhr*.70)} BPM`,
        });
        localStorage.setItem('vitalityDOB', d);
    }

    function applyTheme(t) {
        const dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        localStorage.setItem('vitalityTheme', t);
    }
    function setT(t) { setTheme(t); applyTheme(t); }

    const z = zones;

    /* ── Reusable primitives ── */

    function Pts({v}) {
        return <span style={{color:'var(--accent)', fontWeight:600}}>{v}</span>;
    }

    function SectionCard({id, icon, title, subtitle, children}) {
        return (
            <div id={id} className="section-card">
                <div style={{display:'flex', alignItems:'flex-start', gap:12, marginBottom:20}}>
                    <div style={{width:40, height:40, minWidth:40, background:'#00a3e0', borderRadius:12,
                                 display:'flex', alignItems:'center', justifyContent:'center', fontSize:'1.25rem'}}>
                        {icon}
                    </div>
                    <div style={{minWidth:0}}>
                        <h2 className="section-title">{title}</h2>
                        {subtitle && <p className="section-subtitle">{subtitle}</p>}
                    </div>
                </div>
                {children}
            </div>
        );
    }

    function Tbl({children, small}) {
        return (
            <div className="tbl-wrap">
                <table style={{fontSize: small ? '0.78rem' : '0.875rem'}}>{children}</table>
            </div>
        );
    }

    function THead({cols}) {
        return (
            <thead>
                <tr className="v-thead">
                    {cols.map((c,i) => (
                        <th key={i} style={{
                            textAlign: i===0 ? 'left' : 'right',
                            padding:'11px 16px', fontWeight:600,
                            fontSize:'0.78rem', letterSpacing:'0.03em',
                            color:'var(--text-secondary)', whiteSpace:'nowrap'
                        }}>{c}</th>
                    ))}
                </tr>
            </thead>
        );
    }

    function TR({label, pts, cap, note}) {
        return (
            <tr className="tbl-row">
                <td style={{padding:'11px 16px', lineHeight:1.4}}>
                    {label}{cap && <span className="badge-cap">CAPPED</span>}
                    {note && <span style={{display:'block', fontSize:'0.7rem', color:'var(--text-muted)', marginTop:2}}>{note}</span>}
                </td>
                <td style={{padding:'11px 16px', textAlign:'right', fontWeight:600, color:'var(--accent)', whiteSpace:'nowrap'}}>
                    {pts}
                </td>
            </tr>
        );
    }

    function ListRow({label, pts, note}) {
        return (
            <div className="list-row">
                <span>
                    {label}
                    {note && <span className="list-row-note">{note}</span>}
                </span>
                <span className="list-row-pts">{pts}</span>
            </div>
        );
    }

    function BetweenRow({label, pts, note}) {
        return (
            <div className="between-row">
                <span>
                    {label}
                    {note && <span className="between-row-note">{note}</span>}
                </span>
                <span className="between-row-pts">{pts}</span>
            </div>
        );
    }

    function InfoBox({color, children}) {
        return <div className={`info-box v-${color}`}>{children}</div>;
    }

    /* ═══════════════════════════════ RENDER ═══════════════════════════════ */
    return (
        <div style={{minHeight:'100vh'}}>

            {/* ── HEADER ── */}
            <div className="header-bg" style={{paddingBottom:36}}>
                <div className="header-inner">

                    {/* Title row */}
                    <div className="header-top">
                        <div style={{display:'flex', alignItems:'center', gap:12}}>
                            <i className="fa-solid fa-heart-pulse" style={{fontSize:'2.2rem', color:'white', flexShrink:0}}></i>
                            <div>
                                <h1 style={{margin:0, fontSize:'clamp(1.2rem,4vw,2rem)', fontWeight:700,
                                            color:'white', letterSpacing:'-0.02em', lineHeight:1.2}}>
                                    Vitality Points Explorer
                                </h1>
                                <p style={{margin:'3px 0 0', color:'rgba(255,255,255,0.78)', fontSize:'0.8rem'}}>
                                    Discovery Vitality South Africa • Official Guide
                                </p>
                            </div>
                        </div>

                        <div className="header-controls">
                            <div className="theme-toggle">
                                {[['light','fa-sun'],['dark','fa-moon'],['system','fa-desktop']].map(([t,ic]) => (
                                    <button key={t} className={`theme-btn${theme===t?' active':''}`} onClick={() => setT(t)}>
                                        <i className={`fa-solid ${ic}`}></i>
                                    </button>
                                ))}
                            </div>
                            <a href="https://www.discovery.co.za/assets/discoverycoza/vitality/how-to-join/points-and-partners.pdf"
                               target="_blank" className="pdf-link">
                                <i className="fa-solid fa-file-pdf"></i> PDF
                            </a>
                        </div>
                    </div>

                    {/* DOB panel */}
                    <div className="dob-panel" style={{marginTop:22, borderRadius:20, padding:'20px'}}>

                        <div className="dob-row">
                            <div style={{flex:'1 1 0', minWidth:0}}>
                                <h2 style={{margin:0, color:'white', fontSize:'1rem', fontWeight:600}}>
                                    Personal Heart Rate Zones
                                </h2>
                                <p style={{margin:'4px 0 0', color:'rgba(255,255,255,0.72)', fontSize:'0.8rem'}}>
                                    Enter your date of birth to see exact BPM targets in the fitness tables
                                </p>
                            </div>
                            <div className="dob-input-wrap">
                                <input type="date" value={dob} className="dob-input"
                                    onChange={e => { setDob(e.target.value); calcHR(e.target.value); }}
                                    style={{width:'100%', maxWidth:'100%', minWidth:0, display:'block',
                                            padding:'11px 14px', borderRadius:12, boxSizing:'border-box',
                                            WebkitAppearance:'none', appearance:'none',
                                            fontSize:'0.95rem', fontFamily:'inherit'}} />
                            </div>
                        </div>

                        {maxHR && (
                            <div style={{marginTop:16, background:'var(--bg-card)', borderRadius:16,
                                         padding:'18px', color:'var(--text-primary)'}}>
                                <div className="hr-grid">
                                    <div>
                                        <div style={{fontSize:'0.68rem', color:'var(--text-muted)', letterSpacing:'0.08em', fontWeight:700, textTransform:'uppercase'}}>Age</div>
                                        <div style={{fontSize:'2.8rem', fontWeight:800, color:'var(--accent)', lineHeight:1}}>{age}</div>
                                    </div>
                                    <div>
                                        <div style={{fontSize:'0.68rem', color:'var(--text-muted)', letterSpacing:'0.08em', fontWeight:700, textTransform:'uppercase'}}>Max HR</div>
                                        <div style={{fontSize:'2.8rem', fontWeight:800, lineHeight:1}}>{maxHR}</div>
                                        <div style={{fontSize:'0.68rem', color:'var(--text-muted)', marginTop:2}}>BPM (220 − {age})</div>
                                    </div>
                                    <div className="hr-zones-block">
                                        <div style={{fontSize:'0.68rem', color:'var(--text-muted)', letterSpacing:'0.08em', fontWeight:700, textTransform:'uppercase', marginBottom:8}}>Your Zones</div>
                                        <div className="zones-grid">
                                            {[
                                                ['60–69%', z.z60_69, 'var(--bg-success)', 'var(--text-success)'],
                                                ['70–79%', z.z70_79, 'var(--bg-warn)',    'var(--text-warn)'],
                                                ['80%+',   z.z80p,   'var(--bg-orange)',  'var(--text-orange)'],
                                            ].map(([lbl, val, bg, tc]) => (
                                                <div key={lbl} style={{background:bg, borderRadius:12, padding:'9px 6px', textAlign:'center'}}>
                                                    <div style={{fontSize:'0.65rem', fontWeight:700, color:tc, marginBottom:3}}>{lbl}</div>
                                                    <div style={{fontFamily:'monospace', fontSize:'0.82rem', fontWeight:700}}>{val}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            </div>

            {/* ── MAIN ── */}
            <div className="main-wrap">

                {/* Nav pills */}
                <div style={{display:'flex', flexWrap:'wrap', gap:6, marginBottom:28,
                             borderBottom:'1px solid var(--border)', paddingBottom:16}}>
                    {[['#health','Health Check'],['#screenings','Screenings'],['#fitness','Fitness'],
                      ['#eating','Eat Healthy'],['#family','Family'],['#vaccinations','Vaccinations'],
                      ['#chronic','Chronic'],['#status','Status Levels']].map(([h,l]) => (
                        <a key={h} href={h} className="nav-pill">{l}</a>
                    ))}
                </div>


                {/* ══ 01 HEALTH CHECK ══ */}
                <SectionCard id="health" icon="📋"
                    title="01 • Online Assessments & Vitality Health Check"
                    subtitle="Max 25,000 points per year • Members 18+">

                    <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(min(100%,280px),1fr))', gap:20}}>
                        <div>
                            <h3 style={{margin:'0 0 10px', fontSize:'0.9rem', fontWeight:600}}>Online Assessments</h3>
                            <ListRow label="Vitality Age assessment" pts="1,500 once/year" />
                            <ListRow label="Mental Wellbeing Assessments" pts="500 × 2 = 1,000/year"
                                     note="Must be 6 months apart to earn both" />
                        </div>
                        <div>
                            <h3 style={{margin:'0 0 6px', fontSize:'0.9rem', fontWeight:600}}>Vitality Health Check (5 measures)</h3>
                            <p style={{margin:'0 0 10px', fontSize:'0.75rem', color:'var(--text-muted)'}}>
                                Blood pressure • Blood glucose • Cholesterol • Weight assessment • Non-smoker's declaration
                            </p>
                            <Tbl>
                                <thead><tr className="v-thead">
                                    <th style={{textAlign:'left',  padding:'9px 12px', fontSize:'0.75rem', color:'var(--text-secondary)'}}>In-range</th>
                                    <th style={{textAlign:'center',padding:'9px 12px', fontSize:'0.75rem', color:'var(--text-secondary)'}}>0 high-risk</th>
                                    <th style={{textAlign:'center',padding:'9px 12px', fontSize:'0.75rem', color:'var(--text-secondary)'}}>1+ high-risk</th>
                                </tr></thead>
                                <tbody>
                                    {[['5','22,500','—'],['4','15,000','5,000'],['3','10,000','5,000'],
                                      ['2','7,500','5,000'],['1','5,000','5,000']].map(([n,a,b]) => (
                                        <tr key={n} className="tbl-row">
                                            <td style={{padding:'8px 12px'}}>{n}</td>
                                            <td style={{padding:'8px 12px',textAlign:'center',fontWeight:600,color:'var(--accent)'}}>{a}</td>
